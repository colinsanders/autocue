<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Autocue</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101318;color:#eef1f4;font:17px/1.5 system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
form{width:min(420px,100%);background:#1c222b;border:1px solid #394351;border-radius:14px;padding:28px}
h1{margin:0 0 18px;font-size:26px;letter-spacing:.02em}
label{display:block;font-size:15px;color:#afbac8;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:18px;color:#eef1f4;background:#101318;border:1px solid #4a596b;border-radius:9px;padding:12px;min-height:48px}
input[type=password]:focus{outline:2px solid #e4b06e;outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;margin:16px 0 20px;color:#eef1f4}
.row input{width:22px;height:22px;accent-color:#e4b06e}
button{width:100%;font:inherit;font-weight:700;background:#e4b06e;color:#181a20;border:0;border-radius:9px;min-height:48px;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:1.5em;margin:14px 0 0;font-size:15px;color:#ffb3a7}
</style>
</head>
<body>
<form id="f" autocomplete="on">
<h1>Autocue</h1>
<label for="pw">Wachtwoord</label>
<input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<div class="row"><input type="checkbox" id="rem" checked><label for="rem" style="margin:0;color:inherit">Onthouden op dit toestel</label></div>
<button id="go">Openen</button>
<p id="msg" role="status"></p>
</form>

const KEY='autocue-pw';
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=document.getElementById('msg'),btn=document.getElementById('go');
async function decrypt(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.iv)},key,bytes(D.data));
  return new TextDecoder().decode(plain);
}
async function unlock(pw,remember){
  if(!window.crypto||!crypto.subtle){msg.textContent='Deze pagina werkt alleen via https in Safari.';return}
  btn.disabled=true;msg.style.color='#afbac8';msg.textContent='Bezig met openen…';
  let html;
  try{html=await decrypt(pw)}catch(e){
    try{localStorage.removeItem(KEY)}catch(_){}
    btn.disabled=false;msg.style.color='#ffb3a7';msg.textContent='Verkeerd wachtwoord.';return;
  }
  try{remember?localStorage.setItem(KEY,pw):localStorage.removeItem(KEY)}catch(_){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();unlock(document.getElementById('pw').value,document.getElementById('rem').checked)});
let saved=null;try{saved=localStorage.getItem(KEY)}catch(_){}
if(saved)unlock(saved,true);
}
